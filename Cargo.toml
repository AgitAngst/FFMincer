[package]
name = "ffmincer"
version = "0.1.0"
edition = "2024"
description = "Audio and video converter on top of ffmpeg"
license = "MIT"
repository = "https://github.com/AgitAngst/FFMincer"
publish = false

[[bin]]
name = "ffmincer"
path = "src/main.rs"

[dependencies]
# Общий вид и обновления семьи Anvil. Правка набора на живую — `[patch]` в .cargo/config.toml (не в git).
anvil-ui = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.2.0" }
anvil-update = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.2.0" }
eframe = "0.36.2"
rfd = "0.17.2"

[build-dependencies]
anvil-ui = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.2.0" }
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
